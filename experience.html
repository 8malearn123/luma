<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0e0d11; --bg2:#0b0a0d; --panel:#141319; --panel2:#19181e; --panel3:#1b1a21;
    --gold:#937842; --gold-light:#caa85f; --gold-bright:#dbbd81; --gold-pale:#e3c98f; --gold-deep:#7c6335;
    --white:#f6f2ec; --cream:#f0ebe0; --muted:#7c7783; --muted-deep:#4f4c57;
    --line:#1e1d24; --green:#6fa86a;
  }
  html{scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--white);font-family:'IBM Plex Sans Arabic','Cairo',sans-serif;font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;}
  .serif{font-family:'Bodoni Moda',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0.18em;direction:ltr;text-transform:uppercase;}
  .num{font-family:'Bodoni Moda',serif;font-weight:500;direction:ltr;}
  .gold-fill{background:linear-gradient(120deg,#dbbd81,#caa85f 35%,#937842);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  ::selection{background:var(--gold);color:#0e0d11;} a{color:inherit;text-decoration:none;}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px;}

  /* nav */
  .nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:rgba(11,10,8,0.9);backdrop-filter:blur(20px);border-bottom:0.5px solid var(--line);}
  .nav .brand a{display:inline-flex;align-items:center;gap:9px;font-family:'Bodoni Moda',serif;font-weight:400;font-size:24px;letter-spacing:0.26em;color:var(--gold-light);direction:ltr;transition:color .25s;}
  .nav .brand a:hover{color:var(--gold-bright);}
  .nav .brand .home{font-family:'IBM Plex Sans Arabic','Cairo',sans-serif;font-size:12px;letter-spacing:0;color:var(--muted);font-weight:400;}
  .nav .links{display:flex;gap:24px;align-items:center;}
  .nav .links a{font-size:14px;color:var(--cream);transition:color .25s;}
  .nav .links a:hover{color:var(--gold-light);}
  @media(max-width:680px){.nav .links a.hidem{display:none;}.nav .brand .home{display:none;}}

  .btn{font-family:'IBM Plex Sans Arabic','Cairo',sans-serif;font-weight:500;font-size:14.5px;padding:13px 28px;border-radius:4px;cursor:pointer;border:none;transition:all .25s;white-space:nowrap;}
  .btn-gold{background:linear-gradient(120deg,#dbbd81,#caa85f 45%,#937842);color:#0e0d11;}
  .btn-gold:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .btn-gold:disabled{opacity:0.4;cursor:not-allowed;filter:none;transform:none;}
  .btn-ghost{background:transparent;border:1px solid var(--gold-deep);color:var(--gold-light);}
  .btn-ghost:hover{background:rgba(147,115,53,0.12);border-color:var(--gold-light);}

  /* header */
  .head{position:relative;padding:40px 0 26px;overflow:hidden;border-bottom:0.5px solid var(--line);}
  .head .lattice{position:absolute;inset:0;opacity:0.16;}
  .head-inner{position:relative;z-index:2;display:flex;align-items:center;gap:18px;}
  .head .av{width:74px;height:74px;border-radius:50%;background:linear-gradient(140deg,#1b1a21,#0c0b0e);border:1px solid var(--gold-deep);display:flex;align-items:center;justify-content:center;font-family:'Bodoni Moda',serif;font-size:34px;color:var(--gold-light);flex-shrink:0;direction:ltr;}
  .head .meta h1{font-family:'IBM Plex Sans Arabic','Cairo',sans-serif;font-weight:600;font-size:24px;color:var(--white);}
  .head .meta .role{font-size:14px;color:var(--gold-pale);margin-top:2px;}
  .head .meta .sub{display:flex;align-items:center;gap:14px;margin-top:8px;font-size:13px;color:var(--muted);flex-wrap:wrap;}
  .head .meta .sub .star{color:var(--gold-light);}
  .head .badge{margin-right:auto;align-self:flex-start;font-size:12px;color:var(--gold-light);border:0.5px solid var(--gold-deep);background:rgba(147,115,53,0.1);padding:6px 14px;border-radius:30px;white-space:nowrap;}
  @media(max-width:560px){.head .badge{display:none;}}

  /* bio + reviews */
  .bio-card{background:var(--panel);border:0.5px solid var(--line);border-radius:16px;padding:20px 24px;margin-top:24px;display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
  .rv{background:var(--panel);border:0.5px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
  .rv .rtop{display:flex;align-items:center;gap:11px;}
  .rv .av2{width:36px;height:36px;border-radius:50%;background:var(--panel3);border:0.5px solid var(--gold-deep);display:flex;align-items:center;justify-content:center;font-family:'Bodoni Moda',serif;color:var(--gold-light);font-size:15px;flex-shrink:0;}
  .rv .rn{font-size:13.5px;font-weight:600;color:var(--white);}
  .rv .rd{font-size:11px;color:var(--muted);}
  .rv .rstars{margin-inline-start:auto;color:var(--gold-light);font-size:13px;letter-spacing:2px;}
  .rv .rt{font-size:13.5px;color:var(--cream);line-height:2;margin-top:9px;}
  .st-pick span{cursor:pointer;font-size:27px;color:var(--muted-deep);transition:color .15s,transform .15s;display:inline-block;}
  .st-pick span.on{color:var(--gold-light);}
  .st-pick span:hover{transform:scale(1.15);}

  /* tabs */
  .tabs{display:flex;gap:8px;justify-content:center;margin:26px 0 0;}
  .tab{font-family:'IBM Plex Sans Arabic','Cairo',sans-serif;font-size:14.5px;font-weight:500;color:var(--muted);background:transparent;border:0.5px solid var(--line);border-radius:30px;padding:10px 24px;cursor:pointer;transition:all .25s;}
  .tab:hover{color:var(--gold-light);border-color:var(--gold-deep);}
  .tab.active{color:#0e0d11;background:linear-gradient(120deg,#dbbd81,#937842);border-color:transparent;}

  /* stepper */
  .stepper{display:flex;align-items:center;justify-content:center;gap:0;margin:30px 0 8px;flex-wrap:wrap;}
  .stp{display:flex;align-items:center;gap:10px;}
  .stp .dot{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);background:var(--panel);transition:all .3s;direction:ltr;flex-shrink:0;}
  .stp .lb{font-size:13px;color:var(--muted);transition:color .3s;}
  .stp.active .dot{border-color:var(--gold-light);color:#0e0d11;background:linear-gradient(120deg,#dbbd81,#937842);}
  .stp.active .lb{color:var(--gold-light);}
  .stp.done .dot{border-color:var(--gold-deep);color:var(--gold-light);background:rgba(147,115,53,0.14);}
  .stp.done .lb{color:var(--cream);}
  .stp-line{width:34px;height:1px;background:var(--line);margin:0 7px;}
  .stp-line.fill{background:var(--gold-deep);}
  @media(max-width:600px){.stp .lb{display:none;}.stp-line{width:20px;}}

  /* panel */
  .panel{background:linear-gradient(168deg,var(--panel2),var(--panel));border:0.5px solid var(--line);border-radius:8px;padding:30px;margin-top:22px;}
  .panel h2{font-family:'IBM Plex Sans Arabic','Cairo',sans-serif;font-weight:600;font-size:19px;color:var(--white);margin-bottom:4px;}
  .panel .hint{font-size:13.5px;color:var(--muted);margin-bottom:22px;}

  /* service options */
  .opt{display:flex;align-items:center;gap:16px;border:0.5px solid var(--line);background:var(--panel3);border-radius:6px;padding:16px 18px;cursor:pointer;transition:border-color .25s,background .25s;margin-bottom:12px;}
  .opt:hover{border-color:var(--gold-deep);}
  .opt.sel{border-color:var(--gold-light);background:rgba(147,115,53,0.08);}
  .opt .radio{width:20px;height:20px;border-radius:50%;border:1px solid var(--gold-deep);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .25s;}
  .opt.sel .radio{border-color:var(--gold-light);}
  .opt.sel .radio::after{content:'';width:10px;height:10px;border-radius:50%;background:linear-gradient(120deg,#dbbd81,#937842);}
  .opt .info{flex:1;}
  .opt .info .t{font-size:15.5px;color:var(--white);font-weight:500;}
  .opt .info .d{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:7px;}
  .opt .price{text-align:left;} .opt .price .v{font-family:'Bodoni Moda',serif;font-size:24px;color:var(--gold-light);direction:ltr;line-height:1;} .opt .price .u{font-size:11px;color:var(--muted);}

  /* dates */
  .label{font-size:13px;color:var(--gold-pale);font-weight:500;margin:6px 0 13px;}
  .dates{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
  .dates::-webkit-scrollbar{height:0;}
  .date{min-width:74px;border:0.5px solid var(--line);background:var(--panel3);border-radius:8px;padding:13px 8px;text-align:center;cursor:pointer;transition:all .25s;flex-shrink:0;}
  .date:hover{border-color:var(--gold-deep);}
  .date.sel{border-color:var(--gold-light);background:rgba(147,115,53,0.1);}
  .date .dow{font-size:12px;color:var(--muted);}
  .date.sel .dow{color:var(--gold-pale);}
  .date .dnum{font-family:'Bodoni Moda',serif;font-size:24px;color:var(--white);direction:ltr;margin:3px 0;}
  .date .mon{font-size:10.5px;color:var(--muted-deep);}

  /* time slots */
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:8px;}
  .slot{border:0.5px solid var(--line);background:var(--panel3);border-radius:6px;padding:12px 8px;text-align:center;cursor:pointer;font-size:13.5px;color:var(--cream);transition:all .25s;direction:ltr;font-family:'IBM Plex Mono',monospace;letter-spacing:0.02em;}
  .slot:hover{border-color:var(--gold-deep);color:var(--gold-light);}
  .slot.sel{border-color:transparent;background:linear-gradient(120deg,#dbbd81,#937842);color:#0e0d11;font-weight:500;}
  .slot.off{opacity:0.3;cursor:not-allowed;text-decoration:line-through;}

  /* staff (salon) */
  .staff{display:flex;flex-direction:column;gap:14px;}
  .scard{border:0.5px solid var(--line);background:var(--panel3);border-radius:10px;padding:16px 18px;transition:border-color .25s;}
  .scard.sel{border-color:var(--gold-light);}
  .scard .sh{display:flex;align-items:center;gap:13px;}
  .scard .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(140deg,#1b1a21,#0c0b0e);border:1px solid var(--gold-deep);display:flex;align-items:center;justify-content:center;font-family:'Bodoni Moda',serif;font-size:20px;color:var(--gold-light);flex-shrink:0;direction:ltr;}
  .scard .si{flex:1;} .scard .si .n{font-size:15px;color:var(--white);font-weight:500;} .scard .si .r{font-size:12.5px;color:var(--gold-pale);}
  .scard .rate{font-size:12.5px;color:var(--cream);white-space:nowrap;} .scard .rate .star{color:var(--gold-light);}
  .scard .avail{font-size:11.5px;margin-top:3px;}
  .scard .avail.ok{color:var(--green);} .scard .avail.full{color:#c08a6a;}
  .scard .stimes{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;margin-top:14px;}
  .scard .fullmsg{margin-top:12px;font-size:12.5px;color:var(--muted);font-style:italic;}

  /* summary */
  .sumrow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:0.5px solid var(--line);font-size:14.5px;}
  .sumrow:last-of-type{border-bottom:none;}
  .sumrow .k{color:var(--muted);} .sumrow .v{color:var(--white);font-weight:500;}
  .total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:18px;border-top:1px solid var(--gold-deep);}
  .total .k{font-size:15px;color:var(--gold-pale);} .total .v{font-family:'Bodoni Moda',serif;font-size:30px;color:var(--gold-light);direction:ltr;}
  .pay{display:flex;gap:12px;margin-top:20px;}
  .pay .m{flex:1;border:0.5px solid var(--line);background:var(--panel3);border-radius:6px;padding:15px;text-align:center;cursor:pointer;font-size:14px;color:var(--cream);transition:all .25s;}
  .pay .m:hover{border-color:var(--gold-deep);}
  .pay .m.sel{border-color:var(--gold-light);background:rgba(147,115,53,0.08);color:var(--gold-light);}
  .note{margin-top:18px;font-size:12.5px;color:var(--muted);display:flex;align-items:flex-start;gap:9px;line-height:1.6;}
  .note .d{color:var(--gold);font-size:8px;margin-top:7px;}

  .actions{display:flex;justify-content:space-between;gap:14px;margin-top:26px;}

  /* success */
  .success{text-align:center;padding:20px 10px;}
  .success .check{width:84px;height:84px;border-radius:50%;border:1px solid var(--gold-deep);background:rgba(147,115,53,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:38px;color:var(--gold-light);}
  .success h2{font-size:26px;color:var(--white);font-weight:600;}
  .success .p{font-size:14.5px;color:var(--gold-pale);margin-top:10px;max-width:42ch;margin-inline:auto;line-height:1.85;}
  .ticket{border:0.5px dashed var(--gold-deep);border-radius:8px;background:var(--panel3);padding:22px;margin:26px auto 0;max-width:420px;text-align:right;}

  /* products */
  @media(hover:none){.pcam{opacity:.85;}}

  /* cart */

  /* checkout modal */
  .cf{margin-bottom:14px;} .cf label{display:block;font-size:13px;color:var(--gold-pale);margin-bottom:7px;}
  .cf input,.cf textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--white);font-family:'IBM Plex Sans Arabic','Cairo',sans-serif;font-size:14px;outline:none;resize:vertical;}
  .cf input:focus,.cf textarea:focus{border-color:var(--gold-deep);}
  .cf .err{border-color:#c0566a !important;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .pays{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px;}


  .reveal{animation:fd .45s ease both;}@keyframes fd{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @media(prefers-reduced-motion:reduce){.reveal{animation:none;}}
  footer{padding:34px;border-top:0.5px solid var(--line);background:var(--bg2);text-align:center;margin-top:50px;}
  footer .ar{font-size:12px;color:var(--muted-deep);}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="lat" width="84" height="84" patternUnits="userSpaceOnUse"><g fill="none" stroke="#937842" stroke-width="1"><circle cx="0" cy="0" r="42"/><circle cx="84" cy="0" r="42"/><circle cx="0" cy="84" r="42"/><circle cx="84" cy="84" r="42"/><circle cx="42" cy="42" r="42"/></g></pattern>
</defs></svg>

<nav class="nav">
  <div class="brand"><a href="index.html" title="العودة للرئيسية">LUMA <span class="home">→ الرئيسية</span></a></div>
  <div class="links">
    <a href="index.html" class="hidem">الرئيسية</a>
    <a href="store.html">← العودة للمتجر</a>

<header class="head">
  <div class="lattice"><svg width="100%" height="100%"><rect width="100%" height="100%" fill="url(#lat)"/></svg></div>
  <div class="wrap head-inner">
    <div class="av" id="exp-av">ر</div>

        <span id="exp-kind">◆ خبيرة موثّقة</span>

</header>

<div class="wrap">
  <div class="bio-card" id="bioCard">
    <div style="flex:1;min-width:250px">
      <div class="mono" style="font-size:10px;color:var(--gold)">ABOUT</div>
      <div style="font-weight:600;font-size:16px;color:var(--white);margin:3px 0 6px" id="bioTitle">نبذة عنها</div>
      <p id="bioTxt" style="font-size:13.5px;color:var(--cream);line-height:2.1"></p>
    </div>
    <a id="bioWork" class="btn btn-ghost" style="display:none;align-self:center;border-radius:30px">🔗 شاهدي أعمالها</a>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-book" onclick="VIEW.show('book')">احجزي موعدًا</button>
    <button class="tab" id="tab-revs" onclick="VIEW.show('revs')">التقييمات <span id="revN" style="font-size:11px;color:var(--muted)"></span></button>
  </div>

  <div id="view-book">
    <div class="stepper" id="stepper"></div>
    <div id="step-host"></div>
  </div>

  <div id="view-revs" style="display:none">

      <div class="eyebrow">CLIENT LOVE</div>

      <p id="revSum"></p>
    </div>
    <div id="revList"></div>
    <div id="expGate"></div>
    <div class="rv" id="rvFormBox" style="margin-top:18px">
      <div style="font-weight:600;font-size:14.5px;color:var(--white);margin-bottom:12px">شاركي تجربتك ✍️ <span id="rvAs" style="font-size:11.5px;color:var(--green);font-weight:400"></span></div>
      <div class="st-pick" id="stPick" style="margin-bottom:10px"></div>
      <input id="rvName" placeholder="اسمك" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--white);font-family:inherit;font-size:13.5px;outline:none;margin-bottom:10px"/>
      <textarea id="rvText" rows="3" placeholder="اكتبي تجربتك مع الخبيرة…" style="width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--white);font-family:inherit;font-size:13.5px;outline:none;resize:vertical;margin-bottom:12px"></textarea>
      <button id="rvSend" class="btn btn-gold" style="width:100%;border-radius:10px">نشر التقييم</button>
    </div>
  </div>

<footer><span class="ar">جميع الحقوق محفوظة لشركة قمة كود · LUMA</span></footer>

<script>
/* ── read provider from URL (?name=&role=&city=&type=) ── */
const qp=new URLSearchParams(location.search);
const EXPERT={
  name:qp.get('name')||'رهف العتيبي',
  role:qp.get('role')||'خبيرة مكياج',
  city:qp.get('city')||'جدة',
  type:qp.get('type')||'expert',
};
const IS_SALON = EXPERT.type==='salon' || /صالون|مركز/.test(EXPERT.role);
document.getElementById('exp-name').textContent=EXPERT.name;
document.getElementById('exp-role').textContent=EXPERT.role;
document.getElementById('exp-av').textContent=EXPERT.name.replace('صالون ','').replace('مركز ','').replace('استوديو ','').charAt(0);
document.getElementById('exp-city').textContent='⌖ '+EXPERT.city;
document.getElementById('exp-kind').textContent=IS_SALON?'⬢ صالون معتمد':'◆ خبيرة موثّقة';

function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h;}
/* free times for a staff member on a given date — simulates appointments already in the system */
function freeTimes(staffIdx,dateKey){
  const h=hashStr(dateKey+'|'+STAFF[staffIdx].n);
  return TIMES.filter((t,i)=>{ if(OFF.has(t))return false; return ((h>>(i)) ^ (h>>(i+staffIdx))) %3 !==0; });
}
function staffRating(i){return (4.6 + ((hashStr(STAFF[i].n)%5)/10)).toFixed(1);}

function renderStepper(){
  let h='';
  STEPS.forEach((s,i)=>{
    const n=i+1;const cls=state.step===n?'active':(state.step>n?'done':'');
    h+=`<div class="stp ${cls}"><span class="dot">${state.step>n?'✓':n}</span><span class="lb">${s}</span></div>`;
    if(i<STEPS.length-1)h+=`<span class="stp-line ${state.step>n?'fill':''}"></span>`;
  });
  document.getElementById('stepper').innerHTML=h;
}

    else if(state.step===4)host.innerHTML=stepConfirm();
    else host.innerHTML=stepDone();
  } else {
    if(state.step===2)host.innerHTML=stepDateTime();
    else if(state.step===3)host.innerHTML=stepConfirm();
    else host.innerHTML=stepDone();
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

function stepService(){
  return `<div class="panel">
    <h2>اختاري الخدمة</h2>
    <div class="hint">حدّدي الخدمة التي ترغبين بحجزها مع ${EXPERT.name}.</div>
    ${BRANCHES.length>1?`<div class="label" style="margin-top:4px">الفرع</div>
    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px">${BRANCHES.map((b,i)=>`
      <button type="button" class="br-chip" onclick="BK.pickBranch(${i})" style="flex:1;min-width:170px;text-align:right;padding:11px 14px;border-radius:11px;cursor:pointer;font-family:inherit;
        border:1.5px solid ${state.branch===i?'var(--gold-light)':'var(--line)'};
        background:${state.branch===i?'rgba(147,115,53,0.12)':'var(--panel3)'};color:var(--white)">
        <b style="display:block;font-size:12.5px;color:${state.branch===i?'var(--gold-light)':'var(--white)'}">${b.n} ${state.branch===i?'●':''}</b>
        <span style="font-size:10.5px;color:var(--muted)">⌖ ${b.c}</span>
      </button>`).join('')}</div>`:''}
    ${SERVICES.map(s=>`<div class="opt ${state.services.includes(s.id)?'sel':''}" onclick="BK.pickService('${s.id}')">
      <span class="radio"></span>
      <div class="info"><div class="t">${s.t}</div><div class="d">◷ ${s.dur}</div></div>
      <div class="price">${OFFER?`<s style="opacity:.45;font-size:14px" dir="ltr">${money(s.price)}</s> `:''}<span class="v">${money(effPrice(s.price))}</span> <span class="u">ر.س</span>${OFFER?`<div style="font-size:9.5px;color:#e8a2ae;font-weight:700">خصم ${OFFER.pct}٪</div>`:''}</div>
    </div>`).join('')}
    <div class="actions">
      <a class="btn btn-ghost" href="store.html">إلغاء</a>
      <button class="btn btn-gold" ${state.services.length?'':'disabled'} onclick="BK.go(2)">التالي ←${state.services.length>1?' ('+state.services.length+' خدمات · '+selETotal()+' ر.س)':''}</button>
    </div>
  </div>`;
}

/* expert: date + time together */
function stepDateTime(){
  return `<div class="panel">
    <h2>اختاري التاريخ والوقت</h2>
    <div class="hint">${selEName()} · ${selEDur()}</div>
    <div class="label">التاريخ</div>
    <div class="dates">${DAYS.map(d=>`<div class="date ${state.date===d.key?'sel':''}" onclick="BK.pickDate('${d.key}')"><div class="dow">${d.dow}</div><div class="dnum">${d.dnum}</div><div class="mon">${d.mon}</div></div>`).join('')}</div>
    <div class="label" style="margin-top:24px">الوقت المتاح</div>
    <div class="slots">${TIMES.map(t=>{const off=OFF.has(t);return `<div class="slot ${off?'off':''} ${state.time===t?'sel':''}" onclick="${off?'':`BK.pickTime('${t}')`}">${t}</div>`;}).join('')}</div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="BK.go(1)">→ رجوع</button>
      <button class="btn btn-gold" ${state.date&&state.time?'':'disabled'} onclick="BK.go(3)">التالي ←</button>
    </div>
  </div>`;
}

/* salon: pick date first */
function stepDateOnly(){
  return `<div class="panel">
    <h2>اختاري التاريخ</h2>
    <div class="hint">${selEName()} · ${selEDur()} — ثم نعرض لكِ الموظفات المتاحات في هذا اليوم.</div>
    <div class="label">التاريخ</div>
    <div class="dates">${DAYS.map(d=>`<div class="date ${state.date===d.key?'sel':''}" onclick="BK.pickDate('${d.key}')"><div class="dow">${d.dow}</div><div class="dnum">${d.dnum}</div><div class="mon">${d.mon}</div></div>`).join('')}</div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="BK.go(1)">→ رجوع</button>
      <button class="btn btn-gold" ${state.date?'':'disabled'} onclick="BK.go(3)">التالي ←</button>
    </div>
  </div>`;
}

/* salon: choose staff + her available time */
function stepStaffTime(){
  const dl=dateLabel(state.date);
  return `<div class="panel">
    <h2>اختاري الموظفة والوقت</h2>
    <div class="hint">${dl} — المواعيد المعروضة لكل موظفة هي أوقاتها <b style="color:var(--gold-pale)">الشاغرة فعليًا</b> حسب جدولها في النظام.</div>
    <div class="staff">
      ${STAFF.map((s,i)=>{
        const free=freeTimes(i,state.date);
        const isSel=state.staff===i;
        return `<div class="scard ${isSel?'sel':''}">
          <div class="sh">
            <div class="av">${s.n.charAt(0)}</div>
            <div class="si"><div class="n">${s.n}</div><div class="r">${s.role}</div>
              <div class="avail ${free.length?'ok':'full'}">${free.length?('● '+free.length+' مواعيد متاحة اليوم'):'● مكتملة في هذا اليوم'}</div>
            </div>
            <div class="rate"><span class="star">★</span> ${staffRating(i)}</div>
          </div>
          ${free.length?`<div class="stimes">${free.map(t=>`<div class="slot ${isSel&&state.time===t?'sel':''}" onclick="BK.pickStaffTime(${i},'${t}')">${t}</div>`).join('')}</div>`
            :`<div class="fullmsg">لا توجد مواعيد شاغرة لـ ${s.n} في هذا اليوم — جرّبي تاريخًا آخر أو موظفة أخرى.</div>`}
        </div>`;
      }).join('')}
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="BK.go(2)">→ رجوع</button>
      <button class="btn btn-gold" ${state.staff!==null&&state.time?'':'disabled'} onclick="BK.go(4)">التالي ←</button>
    </div>
  </div>`;
}

function dateLabel(key){const d=DAYS.find(x=>x.key===key);return d?`${d.dow} ${d.dnum} ${d.mon}`:key;}

function stepConfirm(){
  const deposit=Math.round(selETotal()*0.25);
  return `<div class="panel">
    <h2>تأكيد الحجز</h2>
    <div class="hint">راجعي تفاصيل موعدكِ قبل الدفع.</div>
    <div class="sumrow"><span class="k">${IS_SALON?'الصالون':'الخبيرة'}</span><span class="v">${EXPERT.name}</span></div>
    ${IS_SALON?`<div class="sumrow"><span class="k">الموظفة</span><span class="v">${STAFF[state.staff].n} · ${STAFF[state.staff].role}</span></div>`:''}
    ${selE().map(x=>`<div class="sumrow"><span class="k">${x.t}</span><span class="v">${money(effPrice(x.price))} ر.س</span></div>`).join('')}
    <div class="sumrow"><span class="k">المدة الإجمالية</span><span class="v">${selEDur()}</span></div>
    <div class="sumrow"><span class="k">التاريخ</span><span class="v">${dateLabel(state.date)}</span></div>
    <div class="sumrow"><span class="k">الوقت</span><span class="v">${state.time}</span></div>
    <div class="sumrow"><span class="k">${BRANCHES.length?'الفرع':'الموقع'}</span><span class="v">${BRANCHES.length?(BRANCHES[state.branch].n+' · '+BRANCHES[state.branch].c):EXPERT.city}</span></div>
    ${OFFER?`<div class="sumrow"><span class="k">خصم ${OFFER.occ} (${OFFER.pct}٪)</span><span class="v" style="color:#e8a2ae" dir="ltr">− ${money(selEBase()-selETotal())} ر.س</span></div>`:''}
    <div class="total"><span class="k">الإجمالي</span><span class="v">${OFFER?`<s style="opacity:.4;font-size:14px" dir="ltr">${money(selEBase())}</s> `:''}${money(selETotal())} ر.س</span></div>
    <div class="label" style="margin-top:22px">طريقة الدفع</div>
    <div class="pay">
      <div class="m ${state.pay==='mada'?'sel':''}" onclick="BK.pickPay('mada')">mada</div>
      <div class="m ${state.pay==='apple'?'sel':''}" onclick="BK.pickPay('apple')"> Apple Pay</div>
    </div>
    <div class="note"><span class="d">◆</span><span>لتأكيد الحجز يُدفع عربون مسبق <b style="color:var(--gold-pale)">${money(deposit)} ر.س</b> (25%)، والباقي عند الحضور. دفع آمن عبر بوابة موثّقة.</span></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="BK.go(${IS_SALON?3:2})">→ رجوع</button>
      <button class="btn btn-gold" onclick="BK.confirm()">تأكيد ودفع ${money(deposit)} ر.س</button>
    </div>
  </div>`;
}

function stepDone(){
  const ref='LMA-'+Math.floor(100000+Math.random()*900000);
  return `<div class="panel success">
    <div class="check">✓</div>
    <h2>تمّ تأكيد حجزكِ! ✨</h2>
    <div class="p">أرسلنا تفاصيل الموعد وتذكيرًا عبر واتساب. نتمنّى لكِ تجربة رائعة مع ${IS_SALON?(STAFF[state.staff].n+' في '+EXPERT.name):EXPERT.name}.</div>
    <div class="ticket">
      <div class="sumrow"><span class="k">رقم الحجز</span><span class="v mono" style="color:var(--gold-light)">${ref}</span></div>
      ${IS_SALON?`<div class="sumrow"><span class="k">الموظفة</span><span class="v">${STAFF[state.staff].n}</span></div>`:''}
      <div class="sumrow"><span class="k">الخدمة</span><span class="v">${selEName()}</span></div>
      <div class="sumrow"><span class="k">الموعد</span><span class="v">${dateLabel(state.date)} · ${state.time}</span></div>
      <div class="sumrow"><span class="k">${IS_SALON?'الصالون':'الخبيرة'}</span><span class="v">${EXPERT.name}</span></div>
    </div>
    <div class="actions" style="justify-content:center;margin-top:28px">
      <a class="btn btn-ghost" href="client.html">حجوزاتي</a>
      <a class="btn btn-gold" href="store.html">تصفّحي المزيد</a>
    </div>
  </div>`;
}

const BK={
  pickBranch(i){state.branch=i;render();},
  pickService(id){const i=state.services.indexOf(id);if(i>-1)state.services.splice(i,1);else state.services.push(id);render();},
  pickDate(k){ if(state.date!==k){state.date=k;state.time=null;state.staff=null;} render();},
  pickTime(t){state.time=t;render();},
  pickStaffTime(i,t){state.staff=i;state.time=t;render();},
  pickPay(p){state.pay=p;render();},
  go(n){
    if(n===2&&!state.services.length)return;
    if(IS_SALON){
      if(n===3&&!state.date)return;
      if(n===4&&!(state.staff!==null&&state.time))return;
    } else {
      if(n===3&&!(state.date&&state.time))return;
    }
    state.step=n;render();
  },
  confirm(){
    try{window.LumaEvents&&LumaEvents.push('booking','حجز جديد لدى '+EXPERT.name+(state.services&&state.services.length?': '+state.services.map(s=>s.n).join(' + '):'')+(state.date?' — '+state.date:''),'experience.html?name='+encodeURIComponent(EXPERT.name)+'&role='+encodeURIComponent(EXPERT.role)+'&city='+encodeURIComponent(EXPERT.city)+'&type='+EXPERT.type);}catch(e){}
    state.step=LAST;render();
  }
};
window.BK=BK;
render();

</script>
<script src="luma-theme.js"></script>
<script src="luma-i18n.js"></script>
</body>
</html>
