<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0C0B0E"/>
<script src="luma-store.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LUMA — احجزي موعدك</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700&family=Bodoni+Moda:opsz,wght@6..96,500&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#09090b;--card:#151517;--ac:#e5c158;--tx:#f5f1e8}
  /* قوالب الموقع — لكل قالب استدارة وظل وحدود مختلفة، والأثر مثبت بالاختبارات */
  body.theme-modern{--rad:16px;--sec-gap:26px;--shadow:0 10px 26px rgba(0,0,0,.28);--bd:1px}
  body.theme-minimal{--rad:4px;--sec-gap:20px;--shadow:none;--bd:1px}
  body.theme-bold{--rad:10px;--sec-gap:32px;--shadow:0 16px 38px rgba(0,0,0,.45);--bd:2px}
  body.theme-classic{--rad:0px;--sec-gap:24px;--shadow:0 2px 0 color-mix(in srgb,var(--ac) 35%,transparent);--bd:1px}
  body[class*="theme-"] .card,body[class*="theme-"] .offer-c,body[class*="theme-"] .rev-c,
  body[class*="theme-"] .team-c,body[class*="theme-"] .perk-c,body[class*="theme-"] .brand-c,
  body[class*="theme-"] .faq-c,body[class*="theme-"] .sec-box{border-radius:var(--rad);box-shadow:var(--shadow);border-width:var(--bd)}
  .sec-box{background:var(--card);border:1px solid var(--ln);padding:15px 16px;margin-bottom:10px}
  .sec-t{font-size:14px;font-weight:700;margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .sec-t .no{font-family:'Bodoni Moda',serif;color:var(--ac);font-size:15px}
  .perk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:10px}
  .perk-c{background:var(--card);border:1px solid var(--ln);padding:13px 14px;text-align:center}
  .perk-c .ic{font-size:20px;display:block;margin-bottom:6px}
  .brand-row{display:flex;gap:9px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
  .brand-c{flex:0 0 92px;background:var(--card);border:1px solid var(--ln);padding:14px 8px;text-align:center;font-size:12px}
  .faq-c{background:var(--card);border:1px solid var(--ln);padding:12px 14px;margin-bottom:8px}
  .faq-c summary{cursor:pointer;font-size:13px;font-weight:600;list-style:none}
  .faq-c summary::-webkit-details-marker{display:none}
  .faq-c p{font-size:12.5px;opacity:.72;line-height:1.9;margin-top:9px}
  .cd-row{display:flex;gap:8px;justify-content:center;margin:10px 0}
  .cd-box{background:var(--card);border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);border-radius:var(--rad,12px);padding:10px 14px;text-align:center;min-width:64px}
  .cd-box b{display:block;font-family:'Bodoni Moda',serif;font-size:22px;color:var(--ac);direction:ltr}
  .cd-box span{font-size:10.5px;opacity:.6}
  .wide-c{position:relative;border-radius:var(--rad,14px);overflow:hidden;border:1px solid var(--ln);min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;margin-bottom:10px;background:linear-gradient(120deg,color-mix(in srgb,var(--ac) 20%,transparent),color-mix(in srgb,var(--ac) 5%,transparent))}
  .divider-c{text-align:center;padding:16px;margin:14px 0;border-block:1px solid color-mix(in srgb,var(--ac) 35%,transparent);font-size:13.5px;font-weight:600;color:var(--ac)}
  .cta-c{text-align:center;background:linear-gradient(120deg,color-mix(in srgb,var(--ac) 22%,transparent),color-mix(in srgb,var(--ac) 6%,transparent));border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);border-radius:var(--rad,14px);padding:22px 18px;margin-bottom:10px}
  .hours-r{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ln);font-size:12.5px}
  .hours-r:last-child{border-bottom:none}
  body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
  .wrap{max-width:430px;margin:0 auto;padding-bottom:40px}
  .cover{position:relative;height:150px;background:linear-gradient(140deg,color-mix(in srgb,var(--ac) 25%,transparent),var(--bg))}
  .cover img{width:100%;height:100%;object-fit:cover}
  .backTop{position:absolute;top:14px;right:14px;z-index:5;width:38px;height:38px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ac) 50%,transparent);background:rgba(10,8,6,.45);backdrop-filter:blur(6px);color:var(--ac);font-size:17px;cursor:pointer;line-height:1;transition:transform .15s,background .2s}
  .backTop:hover{transform:translateX(2px);background:rgba(10,8,6,.65)}
  .logo{position:absolute;bottom:-26px;right:18px;width:58px;height:58px;border-radius:16px;border:1px solid var(--ac);background:var(--card);color:var(--ac);display:flex;align-items:center;justify-content:center;font-family:'Bodoni Moda',serif;font-size:24px;overflow:hidden}
  .logo img{width:100%;height:100%;object-fit:cover}
  .head{padding:36px 18px 8px}
  .head h1{font-size:19px}
  .head .bio{font-size:11.5px;opacity:.65;line-height:1.8;margin-top:4px}
  .head .meta{font-size:10.5px;opacity:.45;margin-top:4px}
  .gal{padding:2px 0 10px}
  .gal .gal-t{font-size:12px;color:var(--ac);font-weight:700;margin-bottom:9px}
  .gal-row{display:flex;gap:9px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .gal-row::-webkit-scrollbar{display:none}
  .gal-it{flex:0 0 auto;width:104px;height:104px;border-radius:var(--rad,16px);overflow:hidden;border:1px solid rgba(128,128,128,.22);background:var(--card);position:relative;padding:0;cursor:pointer}
  .gal-it img{width:100%;height:100%;object-fit:cover;display:block}
  .gal-it .vid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);color:#fff;font-size:24px}
  .gal-lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:20px}
  .gal-lb img,.gal-lb video{max-width:94vw;max-height:82vh;border-radius:14px}
  .gal-lb iframe{width:min(94vw,760px);aspect-ratio:16/9;border:none;border-radius:14px}
  .gal-lb .gx{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:17px;cursor:pointer}
  .wpop{position:fixed;inset:0;z-index:70;background:rgba(8,6,10,.66);backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .25s}
  .wpop.show{opacity:1}
  .wpop .wcard{position:relative;width:360px;max-width:92vw;background:var(--card);color:var(--tx);border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);border-radius:calc(var(--rad,16px) + 6px);padding:34px 26px 26px;text-align:center;box-shadow:0 34px 90px rgba(0,0,0,.55);transform:translateY(14px) scale(.97);transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
  .wpop.show .wcard{transform:none}
  .wpop .wx{position:absolute;top:12px;left:12px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(128,128,128,.18);color:var(--tx);cursor:pointer;font-size:12px;line-height:1}
  .wpop .wlogo{width:56px;height:56px;border-radius:16px;border:1px solid var(--ac);color:var(--ac);display:flex;align-items:center;justify-content:center;font-family:'Bodoni Moda',serif;font-size:25px;margin:0 auto 12px}
  .wpop .wsalon{font-size:11px;color:var(--ac);font-weight:700;letter-spacing:.04em;margin-bottom:8px}
  .wpop .wmsg{font-size:15.5px;font-weight:600;line-height:2;color:var(--tx)}
  .wpop .wok{width:100%;margin-top:20px;border:none;border-radius:calc(var(--rad,16px) - 2px);padding:13px;background:var(--ac);color:var(--bg);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .feat{display:inline-block;font-size:9.5px;font-weight:700;color:var(--bg);background:var(--ac);border-radius:20px;padding:2px 9px;margin-bottom:5px}
  .mapc{background:var(--card);border:1px solid rgba(128,128,128,.18);border-radius:var(--rad,16px);padding:15px 16px;margin-top:20px}
  .mapc .mt{font-size:12px;color:var(--ac);font-weight:700;margin-bottom:10px}
  .mapc .mapf{width:100%;height:210px;border:none;border-radius:calc(var(--rad,16px) - 5px);background:rgba(128,128,128,.08)}
  .policy{background:var(--card);border:1px solid rgba(128,128,128,.18);border-radius:var(--rad,16px);padding:15px 16px;margin-top:20px}
  .policy.compact{margin-top:14px;font-size:11px}
  .policy .pt{font-size:12px;color:var(--ac);font-weight:700;margin-bottom:9px}
  .policy .pl{display:flex;gap:8px;font-size:11.8px;opacity:.78;line-height:2}
  .policy .pl span{color:var(--ac);font-size:8px;line-height:2.6}
  .aboutBtn{margin-right:6px;border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--ac);border-radius:20px;padding:3px 12px;font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer;vertical-align:1px}
  .wpop .wabout p:last-child{margin-bottom:0}
  .socs{display:flex;gap:9px;margin-top:11px}
  .soc{width:34px;height:34px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);color:var(--ac);display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s}
  .soc:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--ac) 14%,transparent)}
  .prog{display:flex;gap:6px;padding:14px 18px 4px}
  .prog span{height:5px;flex:1;border-radius:5px;background:rgba(255,255,255,.1);transition:background .3s}
  .prog span.on{background:var(--ac)}
  .step{padding:14px 18px}
  .cat{font-size:11.5px;color:var(--ac);font-weight:700;margin:16px 0 8px}
  .svc,.stf{width:100%;text-align:right;background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:var(--rad,16px);padding:14px;margin-bottom:8px;color:var(--tx);font-family:inherit;cursor:pointer;transition:transform .12s,border-color .2s}
  .svc:active{transform:scale(.98)} .svc:hover,.stf:hover{border-color:var(--ac)}
  .svc.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 9%,var(--card))}
  .svc .tick{width:22px;height:22px;border-radius:50%;border:1px solid color-mix(in srgb,var(--ac) 55%,transparent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .svc.sel .tick{background:var(--ac)}
  .svc{display:flex;justify-content:space-between;align-items:center}
  .svc .n{font-size:13.5px;font-weight:600} .svc .d{font-size:10.5px;opacity:.5;margin-top:2px}
  .svc .p{color:var(--ac);font-weight:700;font-size:13.5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stf{text-align:center;margin:0}
  .stf .av{width:48px;height:48px;border-radius:50%;border:1px solid var(--ac);color:var(--ac);display:flex;align-items:center;justify-content:center;font-family:'Bodoni Moda',serif;font-size:19px;margin:0 auto 8px}
  .stf .nm{font-size:13.5px;font-weight:700} .stf .rl{font-size:10px;opacity:.55;margin-top:2px}
  .stf.leave{opacity:.5} .stf .lv{font-size:9.5px;color:#f0a3b0;font-weight:700;margin-top:3px}
  .stf.sel{background:var(--ac);color:var(--bg)} .stf.sel .av{border-color:var(--bg);color:var(--bg)}
  .reroute{background:var(--card);border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);border-radius:var(--rad,16px);padding:14px;margin-top:12px;font-size:13px;line-height:1.9}
  .reroute b{color:var(--ac)}
  .btn{width:100%;border:none;border-radius:calc(var(--rad,16px) - 2px);padding:14px;background:var(--btn,var(--ac));color:var(--bg);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:14px}
  .btn:disabled{opacity:.35} .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--tx)}
  .days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .day{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:calc(var(--rad,16px) - 1px);padding:11px;text-align:center;color:var(--tx);font-family:inherit;cursor:pointer}
  .day .lb{font-size:12px;font-weight:700} .day .dt{font-size:10px;opacity:.55;margin-top:2px}
  .day.sel{background:var(--ac);color:var(--bg)} .day:disabled{opacity:.32}
  .day .lv{font-size:9px;color:#f0a3b0}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .slot{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:11px;padding:10px 0;color:var(--tx);font-family:inherit;font-size:12px;cursor:pointer;direction:ltr}
  .slot.sel{background:var(--ac);color:var(--bg);font-weight:700} .slot:disabled{opacity:.3;text-decoration:line-through}
  .ticket{background:var(--card);border:1px solid rgba(255,255,255,.09);border-radius:calc(var(--rad,16px) + 6px);overflow:hidden}
  .ticket .th{background:color-mix(in srgb,var(--ac) 12%,transparent);padding:16px}
  .ticket .th .k{font-size:10.5px;color:var(--ac)} .ticket .th h2{font-size:17px;margin-top:3px}
  .ticket .rows{padding:16px;display:grid;gap:11px;font-size:13px}
  .trow2{display:flex;justify-content:space-between} .trow2 .k{opacity:.5}
  .total{border-top:1px dashed rgba(255,255,255,.18);padding-top:12px;font-weight:700}
  .total b{color:var(--ac)}
  .back{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .back button{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:none;color:var(--tx);cursor:pointer;font-size:15px}
  .back h1{font-size:17px}
  .success{text-align:center;padding:60px 18px}
  .ok{width:82px;height:82px;border-radius:50%;background:var(--ac);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
  .wa{display:flex;gap:11px;background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:var(--rad,16px);padding:14px;margin-top:22px;text-align:right;font-size:12px;line-height:1.8}
  .wa .ic{width:38px;height:38px;border-radius:50%;background:#22a55b;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:17px}
  /* ── شبكة الأعمال والبطاقات ── */
  .shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:640px){.shop-grid{grid-template-columns:repeat(2,1fr)}}
  .shp{background:var(--card);border:1px solid var(--ln);border-radius:var(--rad,14px);padding:13px;display:flex;flex-direction:column;gap:8px}
  .shp .im{height:86px;border-radius:10px;background:color-mix(in srgb,var(--ac) 10%,transparent);display:flex;align-items:center;justify-content:center;color:var(--ac);overflow:hidden}
  .shp .im img{width:100%;height:100%;object-fit:cover}
  .shp .nm{font-size:13px;font-weight:600}
  .shp .ct{font-size:10.5px;opacity:.55}
  .shp .row{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
  .shp .pr{font-size:15px;color:var(--ac);font-weight:700}
  .shp .add{background:color-mix(in srgb,var(--ac) 88%,#000 6%);color:#131217;border:none;border-radius:9px;padding:7px 13px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .shp .qty{display:flex;align-items:center;gap:9px}
  .shp .qty button{width:26px;height:26px;border-radius:8px;border:1px solid var(--ac);background:none;color:var(--ac);cursor:pointer;font-size:14px;line-height:1}
  .shs-bg{position:fixed;inset:0;z-index:90;background:rgba(8,6,10,.6);backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s}
  .shs-bg.show{opacity:1}
  .shs{width:100%;max-width:640px;max-height:82vh;overflow-y:auto;background:var(--card);border:1px solid var(--ln);border-bottom:none;border-radius:22px 22px 0 0;padding:18px 20px 24px;transform:translateY(40px);transition:transform .3s cubic-bezier(.2,1.2,.4,1)}
  .shs-bg.show .shs{transform:none}
  /* ── أشكال الواجهة — من محرر «الواجهة»: البطاقات والأزرار والقائمة وطرق العرض ── */
  .ui-card-sharp .svc,.ui-card-sharp .shp,.ui-card-sharp .offer-c,.ui-card-sharp .rev-c,.ui-card-sharp .team-c,.ui-card-sharp .mapc,.ui-card-sharp .policy,.ui-card-sharp .gal-it{border-radius:5px!important}
  .ui-card-outline .svc,.ui-card-outline .shp,.ui-card-outline .offer-c,.ui-card-outline .rev-c,.ui-card-outline .team-c,.ui-card-outline .mapc,.ui-card-outline .policy{border-color:color-mix(in srgb,var(--ac) 60%,transparent)!important;box-shadow:0 0 0 1px color-mix(in srgb,var(--ac) 22%,transparent)}
  .ui-btn-pill .btn{border-radius:28px}
  .ui-btn-rounded .btn{border-radius:12px}
  .ui-btn-square .btn{border-radius:5px}
  .ui-menu-pills .cat{display:inline-block;background:color-mix(in srgb,var(--ac2,var(--ac)) 13%,transparent);border-radius:20px;padding:6px 15px}
  .ui-menu-underline .cat{display:block;border-bottom:2px solid color-mix(in srgb,var(--ac) 55%,transparent);padding-bottom:7px}
  .ui-prod-list .shop-grid{grid-template-columns:1fr!important}
  .ui-prod-list .shp{flex-direction:row;align-items:center;gap:13px}
  .ui-prod-list .shp .im{width:62px;height:62px;flex-shrink:0}
  .ui-prod-list .shp .nm{flex:1}
  .ui-prod-list .shp .row{margin-top:0;margin-right:auto;gap:12px}
  .ui-svc-cards .svc-wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ui-svc-cards .svc{flex-direction:column;align-items:flex-start;gap:10px;height:100%;margin-bottom:0}
  @media(max-width:560px){.ui-svc-cards .svc-wrap{grid-template-columns:1fr}}
  .foot{margin-top:32px;border-top:1px solid var(--ln);padding:24px 6px 12px;text-align:center}
  .foot .socs{justify-content:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ═══ تُقرأ الهوية والثيم مما حفظته المالكة في «مُنشئ الصفحة» ═══ */
const THEMES={
  'dark-luxury':{bg:'#09090b',card:'#151517',ac:'#e5c158',tx:'#f5f1e8'},
  'rose-velvet':{bg:'#1a0e12',card:'#241318',ac:'#e08a9b',tx:'#f8eef1'},
  'minimal-emerald':{bg:'#0a1413',card:'#12201e',ac:'#8fd0c0',tx:'#eef6f4'},
  'pearl-light':{bg:'#f7f3ec',card:'#ffffff',ac:'#9c8047',tx:'#2e241b'},
};
const load=(k,f)=>LumaStore.get(k,f);
const CFG={slug:'lama-beauty',title:'صالون لمسة',bio:'وجهتكِ الأولى للجمال في جدة — مكياج، شعر، وعناية ملكية بلمسات خبيرات.',phone:'0555 123 456',address:'جدة · حي الشاطئ',logo:'',cover:'',theme:'dark-luxury',
  policy:'الحضور قبل الموعد بـ10 دقائق يضمن اكتمال جلستك كاملة.\nيمكن إلغاء أو تعديل الحجز مجاناً قبل 24 ساعة من الموعد.\nالتأخر أكثر من 15 دقيقة قد يتطلب إعادة جدولة الموعد.\nقيمة العربون (إن وُجد) تُخصم من الفاتورة النهائية.',

const IS_PREVIEW=new URLSearchParams(location.search).get('preview')==='1';

  const T=(CFG.theme==='custom'&&CFG.themeCustom)?{...THEMES['dark-luxury'],...CFG.themeCustom}:(THEMES[CFG.theme]||THEMES['dark-luxury']);
  const rt=document.documentElement.style;
  rt.setProperty('--bg',T.bg);rt.setProperty('--card',T.card);rt.setProperty('--ac',T.ac);rt.setProperty('--tx',T.tx);
  rt.setProperty('--ac2',T.ac2||T.ac);rt.setProperty('--btn',T.btn||T.ac);
  /* استدارة الأزرار من الاستوديو تتقدّم على استدارة الثيم */
  const br=(CFG.extras||{}).btnRadius;

function slotsFor(sid,day){
  if(onLeave(sid,day.iso))return[];

function socialUrl(k,v){
  v=String(v||'').trim();if(!v)return null;
  if(/^https?:\/\//i.test(v))return v;
  const h=v.replace(/^@/,'');
  if(k==='ig')return 'https://instagram.com/'+h;
  if(k==='tk')return 'https://tiktok.com/@'+h;
  if(k==='sc')return 'https://snapchat.com/add/'+h;

  if(k==='wa'){let d=h.replace(/\D/g,'');if(d.startsWith('05'))d='966'+d.slice(1);return 'https://wa.me/'+d;}
  return null;
}

/* الرجوع للصفحة السابقة فعلياً: سجل التصفح أولاً، وإن فُتحت الصفحة بتبويب جديد
   نعود لصفحة الإحالة نفسها (التطبيق/الدليل/الرابط) — ولا نلجأ لدليل لوما إلا كخيار أخير */
window.goBack=()=>{
  const ref=document.referrer&&document.referrer!==location.href?document.referrer:'';
  if(history.length>1){
    history.back();
    /* لو ما تحرّك السجل (تبويب جديد) خلال لحظة — نرجع لصفحة الإحالة */
    if(ref)setTimeout(()=>{location.href=ref;},400);
  }
  else if(ref)location.href=ref;
  else location.href='store.html';
};

      <div>📞 <bdo dir="ltr">${esc(CFG.phone||'')}</bdo></div>
      <div>📍 ${esc(CFG.address||'')}</div>
      ${m?`<div><a href="${m.link}" target="_blank" rel="noopener" style="color:var(--ac)">الاتجاهات في خرائط Google</a></div>`:''}
    </div>${socialRow()}`;}
  if(k==='faq')return String(CFG.faqText||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const[q,a]=l.split('|');return `<div style="padding:9px 0;border-bottom:1px solid var(--ln)"><div style="font-size:13px;font-weight:700;color:var(--ac)">${esc((q||'').trim())}</div><div style="font-size:12.5px;opacity:.8;line-height:2;margin-top:4px">${esc((a||'').trim())}</div></div>`;}).join('');
  if(k==='privacy')return paras(CFG.privacyText);
  if(k==='policy')return paras(CFG.policyText);
  const xp=(CFG.pagesExtra||[])[parseInt(String(k).replace('xp',''))||0];
  return xp?paras(xp.body):'';
}
window.openPage=(k,title)=>{
  const old=document.querySelector('.pg-lb');if(old)old.remove();
  const lb=document.createElement('div');lb.className='pg-lb';
  lb.style.cssText='position:fixed;inset:0;z-index:95;background:rgba(8,6,10,.65);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px';
  lb.innerHTML=`<div style="width:100%;max-width:560px;max-height:80vh;overflow-y:auto;background:var(--card);border:1px solid var(--ln);border-radius:var(--rad,16px);padding:20px 22px;text-align:right">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-size:16px;font-weight:800;color:var(--ac)">${esc(title)}</div>
      <button class="pgx" aria-label="إغلاق" style="background:none;border:1px solid var(--ln);border-radius:50%;width:30px;height:30px;color:inherit;cursor:pointer">✕</button></div>
    ${pageBody(k)||'<div style="font-size:12.5px;opacity:.6">لا محتوى بعد.</div>'}
  </div>`;
  lb.addEventListener('click',e=>{if(e.target===lb)lb.remove();});
  lb.querySelector('.pgx').onclick=()=>lb.remove();
  document.body.appendChild(lb);
};
function footerPages(){
  const links=[...SITEPAGES.filter(([k])=>pgEnabled(k)).map(([k,lb])=>[k,lb]),
    ...(CFG.pagesExtra||[]).map((p,i)=>p&&p.on?['xp'+i,p.t]:null).filter(Boolean)];
  if(!links.length)return '';
  return `<div class="fpages" style="display:flex;gap:7px 16px;flex-wrap:wrap;justify-content:center;margin-top:14px">
    ${links.map(([k,lb])=>`<button class="fpg" onclick="openPage('${k}','${String(lb).replace(/'/g,"\\'")}')" style="background:none;border:none;color:inherit;opacity:.75;font-family:inherit;font-size:11.5px;cursor:pointer;padding:2px 0;border-bottom:1px dashed transparent" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.75">${lb}</button>`).join('')}
  </div>`;
}
/* Footer — تذييل الموقع: الاسم والتواصل والسوشل، تديره المالكة من «الواجهة» */
function footerSec(){
  if(CFG.footerOn===false)return '';
  return `<div class="foot">
    <div style="font-size:15.5px;font-weight:800">${esc(CFG.title)}</div>
    <div style="font-size:11.5px;opacity:.65;margin-top:6px">${esc(CFG.address||'')} · <bdo dir="ltr">${esc(CFG.phone||'')}</bdo></div>
    ${CFG.footerNote?`<div style="font-size:11.5px;opacity:.8;margin-top:7px">${esc(CFG.footerNote)}</div>`:''}
    ${socialRow()}
    ${footerPages()}
    <div style="font-size:10.5px;opacity:.45;margin-top:12px">© ${esc(CFG.title)} — مدعوم من <b style="letter-spacing:2px">LUMA</b></div>
  </div>`;
}
/* الخدمات — القسم الأساسي: القائمة وزر المتابعة للحجز */
function servicesSec(){
  const hideC=new Set(CFG.hideCats||[]);
  const SVMETA=load('luma_svc_meta',{})||{};
  return `<h1 style="font-size:18px">اختاري خدمتك <span style="font-size:11px;opacity:.55;font-weight:400">— تقدرين تختارين أكثر من خدمة</span></h1>`+CATS.filter(([k])=>!hideC.has(k)).map(([k,ar])=>{
    const list=SERVICES.filter(x=>{const m=SVMETA[x.n]||{};return x.cat===k&&!m.off&&!m.hide;});if(!list.length)return'';
    return `<div class="cat">${ar}</div><div class="svc-wrap">`+list.map(x=>{
      const im=(load('luma_svc_img')||{})[x.n];
      return `<button class="svc ${svcs.includes(x.id)?'sel':''}" onclick="pickSvc(${x.id})">
      <span style="display:flex;align-items:center;gap:12px">${im?`<img src="${im}" alt="" style="width:46px;height:46px;border-radius:10px;object-fit:cover;border:1px solid color-mix(in srgb,var(--ac) 45%,transparent);flex-shrink:0"/>`:''}<span>${FEAT[x.n]?`<span class="feat"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 17.8 6.7 19.6l1.1-6L3.4 9.4l6-.8z"/></svg> ${esc(FEAT[x.n])}</span>`:''}<span class="n">${x.n}</span><div class="d">${x.d} دقيقة${(SVMETA[x.n]||{}).desc?' · '+esc(SVMETA[x.n].desc):''}</div></span></span>
      <span style="display:flex;align-items:center;gap:10px"><span class="p">${x.p} ر.س</span><span class="tick">${svcs.includes(x.id)?'✓':''}</span></span></button>`;}).join('')+`</div>`;
  }).join('')
  +(selSvcs().length?`<button class="btn" onclick="go(2)">متابعة — ${selSvcs().length>1?selSvcs().length+' خدمات':'خدمة واحدة'} · ${selTotal()} ر.س · ${selDur()} دقيقة</button>`:'');
}
function render(){
  if(step===5){
    app.innerHTML=header()+`<div class="success">
      <div class="ok">✓</div><h1 style="margin-top:18px">تم تأكيد حجزك <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg></h1>
      <p style="font-size:13px;opacity:.7;margin-top:8px">${esc(selName())} · مع ${esc([...new Set(assignedList().map(r=>(STAFF.find(z=>z.id===r.a.staff)||{}).n))].join(' و'))}<br>${date} · <bdo dir="ltr">${(assignedList()[0]||{a:{}}).a.time||''}</bdo></p>
      <div class="wa"><span class="ic">💬</span><div><b>واتساب · ${esc(CFG.title)}</b><br>أهلاً 🌸 حجزك مؤكد يوم ${date} الساعة <bdo dir="ltr">${(assignedList()[0]||{a:{}}).a.time||''}</bdo>. نراكِ قريباً!</div></div>
      <button class="btn ghost" onclick="restart()">حجز موعد آخر</button></div>`;
    window.scrollTo({top:0});return;
  }
  let s='';
  if(step===1){
    /* الصفحة الرئيسية تُبنى من الأقسام المفعّلة بترتيب المالكة — لكل صالون موقع مختلف.
       التكرار مسموح: نفس المفتاح مرتين يُرسم مرتين، والترقيم يتبع الترتيب الفعلي. */
    const SECS={banner:bannersStrip,perks:perksSec,services:servicesSec,offers:offersSec,countdown:countdownSec,
      team:teamSec,gallery:gallery,wide:wideSec,divider:dividerSec,brands:brandsSec,video:videoSec,
      reviews:reviewsSec,hours:hoursSec,location:mapCard,faq:faqSec,text:textSec,
      booking_cta:ctaSec,support:supportSec,insta:instaSec};
    const order=layoutOf().filter(x=>x.on).map(x=>x.k);
    const nums=secNumbers(order);
    const used={};
    s=order.map(k=>{const f=SECS[k];if(!f)return '';used[k]=(used[k]||0)+1;
      return `<div data-sec="${k}-${used[k]}">${f(used[k]===1?nums[k]:'')||''}</div>`;}).join('')
      +policyBox()+footerSec();
  }
  if(step===2){
    s=back('اختاري تاريخ الزيارة',1)+`<div class="days">`+days.map((d,i)=>{
      const off=dayAllOff(d);
      return `<button class="day ${date===d.iso?'sel':''}" ${off?'disabled':''} onclick="pickDate(${i})">
        <div class="lb">${d.lb}</div><div class="dt">${d.dt}</div>${off?'<div class="lv">مغلق</div>':''}</button>`;}).join('')+`</div>
      <button class="btn" ${date?'':'disabled'} onclick="startAssign()">متابعة — اختيار الخبيرة والوقت لكل خدمة</button>`;
  }
  if(step===3){
    const list=selSvcs();const cur=list[curIdx];
    s=back('الخبيرة والوقت لكل خدمة',2)
      +`<div style="font-size:12px;opacity:.6;margin-bottom:10px">زيارة ${date} — لكل خدمة اختاري الخبيرة ثم وقتها المتاح.</div>`
      +list.map((x,i)=>{
        const a=assigns[x.id];const on=i===curIdx;
        const st=a?STAFF.find(z=>z.id===a.staff):null;
        return `<div style="display:flex;align-items:center;gap:9px;border:1px solid ${on?'var(--ac)':'rgba(128,128,128,.2)'};border-radius:12px;padding:9px 13px;margin-bottom:7px;${a?'opacity:.85':''}">
          <span style="width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;${a?'background:var(--ac);color:var(--bg)':'border:1px solid var(--ac);color:var(--ac)'}">${a?'✓':i+1}</span>
          <span style="flex:1;font-size:12.5px;font-weight:600">${esc(x.n)}</span>
          ${a?`<span style="font-size:11px;opacity:.75">${esc(st.n)} · <bdo dir="ltr">${a.time}</bdo></span><button onclick="redoAssign('${x.id}',${i})" style="background:none;border:none;color:var(--ac);font-family:inherit;font-size:10.5px;cursor:pointer;text-decoration:underline">تغيير</button>`:(on?'<span style="font-size:10.5px;color:var(--ac);font-weight:700">الآن ↓</span>':'')}
        </div>`;}).join('');
    if(cur){
      const day=days.find(d=>d.iso===date);
      s+=`<div class="cat" style="margin-top:14px">من تنفّذ «${esc(cur.n)}»؟</div><div class="grid2">`+STAFF.map(x=>{
        const lv=onLeave(x.id,date)||shiftOf(x.id,day.wd).off;
        return `<button class="stf ${lv?'leave':''} ${curStaff===x.id?'sel':''}" ${lv?'disabled':''} onclick="pickStaff('${x.id}')">
          <span class="av">${x.n.charAt(0)}</span><span class="nm">${x.n}</span><div class="rl">${x.role}</div>
          ${lv?'<div class="lv">غير متاحة اليوم</div>':''}</button>`;}).join('')+`</div>`;
      if(curStaff){
        const sl=slotsFor(curStaff,day).map(x=>({...x,taken:x.taken||Object.values(assigns).some(a=>a.staff===curStaff&&a.time===x.t)}));
        s+=sl.length?`<div class="cat" style="margin-top:12px">الأوقات المتاحة</div><div class="slots">${sl.map(x=>`<button class="slot" ${x.taken?'disabled':''} onclick="pickTime('${x.t}')">${x.t}</button>`).join('')}</div>`
          :`<div style="text-align:center;opacity:.55;font-size:13px;padding:18px">لا أوقات متاحة لها هذا اليوم — جرّبي خبيرة أخرى</div>`;
      }else{
        s+=`<div style="text-align:center;opacity:.5;font-size:12px;padding:12px">اختاري الخبيرة لعرض أوقاتها المتاحة</div>`;
      }
    }else{
      s+=`<button class="btn" onclick="go(4)">متابعة للتأكيد</button>`;
    }
  }
  if(step===4){
    s=back('تأكيد الموعد',3)+`<div class="ticket">
      <div class="th"><div class="k">تذكرة الحجز · ${esc(CFG.title)}</div><h2 style="font-size:15.5px;line-height:1.8">${esc(selName())}</h2></div>
      <div class="rows">
        <div class="trow2"><span class="k">التاريخ</span><b>${date}</b></div>
        ${selSvcs().map(x=>{const a=assigns[x.id];const st=a?STAFF.find(z=>z.id===a.staff):null;
          return `<div class="trow2"><span class="k">${esc(x.n)}${st?`<div style="font-size:10px;opacity:.55">${esc(st.n)} · <bdo dir="ltr">${a.time}</bdo></div>`:''}</span><b>${x.p} ر.س</b></div>`;}).join('')}
        <div class="trow2"><span class="k">المدة الإجمالية</span><b>${selDur()} دقيقة</b></div>
        ${coupon?`<div class="trow2" style="color:#6fa86a"><span class="k">كوبون <bdo dir="ltr">${coupon.code}</bdo></span><b>− ${discount()} ر.س</b></div>`:''}
        <div class="trow2 total"><span>الإجمالي</span><b>${selTotal()-discount()} ر.س</b></div>
      </div></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <input id="cpn" placeholder="كود خصم؟ (اختياري)" dir="ltr" value="${coupon?coupon.code:''}"
          style="flex:1;text-align:right;padding:12px 14px;border-radius:12px;border:1px solid rgba(150,130,90,.35);background:transparent;color:inherit;font-family:inherit;font-size:13px;text-transform:uppercase"/>
        <button class="btn ghost" style="margin:0;padding:12px 18px;font-size:13px" onclick="applyCoupon()">تطبيق</button>
      </div>
      ${cpnMsg?`<div style="font-size:12px;color:#c97b88;margin-top:6px">${cpnMsg}</div>`:coupon?`<div style="font-size:12px;color:#6fa86a;margin-top:6px">تم تطبيق الخصم ✓</div>`:''}
      ${policyBox(true)}
      <button class="btn" onclick="confirmBooking()">تأكيد الحجز ✓</button>`;
  }
  app.innerHTML=header()+`<div class="step">${s}</div>`;
  window.scrollTo({top:0});
}
function showReroute(){
  const iso=date||days[0].iso;
  const alt=STAFF.find(x=>x.id!==staff.id&&x.role===staff.role&&!onLeave(x.id,iso))
        ||STAFF.find(x=>x.id!==staff.id&&!onLeave(x.id,iso));
  document.getElementById('reroute').innerHTML=`<div class="reroute">
    💛 ${staff.n} في إجازة حالياً — تحبين الحجز مع <b>${alt?alt.n:'زميلة أخرى'}</b>${alt&&alt.role===staff.role?' (نفس التخصص)':''} أو اختيار تاريخ آخر؟
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
      ${alt?`<button class="btn" style="margin:0;padding:11px;font-size:12.5px" onclick="pickAlt('${alt.id}')">الحجز مع ${alt.n}</button>`:''}
      <button class="btn ghost" style="margin:0;padding:11px;font-size:12.5px" onclick="go(3)">اختيار تاريخ آخر</button>
    </div></div>`;
}
window.go=n=>{step=n;render();};
window.startAssign=()=>{assigns={};curIdx=0;curStaff=null;step=3;render();};
window.redoAssign=(id,i)=>{delete assigns[id];curIdx=i;curStaff=null;render();};
window.restart=()=>{step=1;svcs=[];assigns={};curIdx=0;curStaff=null;staff=null;date=time='';coupon=null;cpnMsg='';render();};
window.pickSvc=id=>{
  /* تبديل الاختيار — يمكن جمع أكثر من خدمة في الموعد الواحد */
  const i=svcs.indexOf(id);if(i>-1)svcs.splice(i,1);else svcs.push(id);
  const y=window.scrollY;render();window.scrollTo({top:y});
};
window.pickStaff=id=>{curStaff=id;const y=window.scrollY;render();window.scrollTo({top:y});};
window.pickDate=i=>{date=days[i].iso;assigns={};curIdx=0;curStaff=null;render();};
window.pickTime=t=>{
  const cur=selSvcs()[curIdx];if(!cur||!curStaff)return;
  assigns[cur.id]={staff:curStaff,time:t};
  curStaff=null;
  /* الخدمة التالية غير المُسندة، وإلا التأكيد */
  const nxt=selSvcs().findIndex(x=>!assigns[x.id]);
  if(nxt===-1){step=4;}else{curIdx=nxt;}
  render();
};
window.confirmBooking=()=>{
  const items=selSvcs().map(x=>({n:x.n,p:x.p,d:x.d,staff:assigns[x.id].staff,time:assigns[x.id].time}));
  items.forEach(it=>{BOOKED.push({staff:it.staff,staffName:(STAFF.find(z=>z.id===it.staff)||{}).n,client:'حجز أونلاين',service:it.n,price:it.p,coupon:coupon?coupon.code:null,date,time:it.time,at:new Date().toISOString()});});
  LumaStore.set('luma_public_bookings',BOOKED);
  try{LumaEvents.push('booking','حجز أونلاين جديد لدى '+CFG.title+': '+items.map(i=>i.n).join(' + ')+' — '+date+' ('+(selTotal()-discount())+' ر.س)','salon.html#board');}catch(e){}
  /* حجوزات اليوم تظهر مباشرة على لوحة الصالون — موعد لكل خدمة بخبيرتها ووقتها */
  if(date===days[0].iso){
    try{
      LumaStore.update('luma_salon_appts',a=>{
        items.forEach((it,ix)=>a.push({id:Date.now()+ix,staff:it.staff,start:(parseInt(it.time)-10)*2,dur:Math.max(1,Math.round(it.d/30)),client:'حجز أونلاين — '+it.n.split(' ')[0],service:it.n,st:'pending',custom:true}));
        return a;},[]);
    }catch(e){}
  }
  step=5;render();
};
render();
</script>
<script src="luma-i18n.js"></script>
</body>
</html>
